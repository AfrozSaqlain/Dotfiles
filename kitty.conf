
# ── Window ──────────────────────────────────────
hide_window_decorations titlebar-only
background_opacity 0.428
background_blur 25
background #111318
foreground #d8dee9

# ── Spacing ─────────────────────────────────────
window_padding_width 6
hide_window_decorations titlebar-only
placement_strategy center

# ── Typography ──────────────────────────────────
font_size 13
# Install a Nerd Font before uncommenting:
font_family JetBrainsMono Nerd Font

# ── Cursor ──────────────────────────────────────
cursor_shape beam
cursor_blink_interval 0
cursor #88c0d0
cursor_text_color #111318

# ── Selection ───────────────────────────────────
selection_foreground #111318
selection_background #88c0d0

# ── Tabs ────────────────────────────────────────
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #111318
active_tab_background #88c0d0
inactive_tab_foreground #a3aab8
inactive_tab_background #242833

# ── Panes ───────────────────────────────────────
active_border_color #89b4fa
inactive_border_color #45475a

# ── macOS ───────────────────────────────────────
macos_show_window_title_in none
macos_option_as_alt yes

